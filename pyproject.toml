[project]
name = "ip-address-sorter"
version = "0.1.1"
description = "Sort a mixed list of IPv4 and IPv6 addresses and ranges in proper numeric order using the ipaddress module."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
